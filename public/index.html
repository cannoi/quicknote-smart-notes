<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>QuickNote Dashboard</title><style>:root{--primary:#4a90e2;--bg:#121212;--text:#e0e0e0;--card-bg:#1e1e1e;--border:#333}body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--text);margin:0;padding:20px;display:flex;flex-direction:column;align-items:center}.container{width:100%;max-width:800px;background:var(--card-bg);padding:20px;border-radius:12px;box-shadow:0 4px 6px rgba(0,0,0,0.3)}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}input,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid var(--border);border-radius:6px;box-sizing:border-box;background:var(--bg);color:var(--text)}button{background:var(--primary);color:#fff;border:none;padding:10px 20px;border-radius:6px;cursor:pointer}.note-card{border-left:5px solid var(--primary);padding:15px;margin:10px 0;background:var(--card-bg);border-radius:4px;display:flex;justify-content:space-between;align-items:center}.pinned{border-left-color:#f39c12}.done{text-decoration:line-through;opacity:0.6}.paf-made-by{position:fixed;right:8px;bottom:8px;width:min(72px,12vw);opacity:.5;pointer-events:none}</style><style>.paf-made-by{position:fixed;right:8px;bottom:8px;width:min(72px,12vw);max-width:12vw;height:auto;object-fit:contain;opacity:.5;background:transparent;padding:0;border:0;box-shadow:none;filter:none;pointer-events:none;z-index:30}</style></head><body><div class="container"><div class="header"><h1>QuickNote 📝</h1><input type="text" id="search" placeholder="🔍 Search notes..." oninput="render()"></div><textarea id="noteInput" placeholder="✨ Write a new note here..."></textarea><button onclick="addNote()">Add Note 🚀</button><div id="notes"></div></div><script>let notes=[];async function fetchNotes(){const res=await fetch('/api/notes');notes=await res.json();render()}async function addNote(){const input=document.getElementById('noteInput');if(!input.value)return;await fetch('/api/notes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:input.value,pinned:false})});input.value='';fetchNotes()}async function toggleNote(id){await fetch(`/api/notes/${id}`,{method:'PATCH'});fetchNotes()}function render(){const q=document.getElementById('search').value.toLowerCase();const container=document.getElementById('notes');container.innerHTML=notes.filter(n=>n.text.toLowerCase().includes(q)).map(n=>`<div class="note-card ${n.pinned?'pinned':''} ${n.done?'done':''}" onclick="toggleNote(${n.id})">${n.text} ${n.done?'✅':'📌'}</div>`).join('');}fetchNotes();</script><img class="paf-made-by" src="/made-by.png" alt="Made with App Builder — Pi SoloHost"></body></html>
